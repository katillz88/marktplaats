  <svg class="layer" id="mg" width="1080" height="1920"><g id="star2" fill="none" stroke="#f2c46d" stroke-linecap="round"></g></svg>
  <div id="bism" class="ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>

  <div id="end2"><svg class="layer" width="1080" height="1920"><g id="star3" fill="none" stroke="#f2c46d" stroke-linecap="round"></g></svg>
    <div class="mgt" id="eBig"></div><div class="pill"><span id="eCta"></span></div><div class="src" id="eSrc"></div></div>
  <div id="flash" class="layer"></div>

<script src="assets/gsap.min.js"></script>
<script>
// ---------- helpers ----------
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7);
const GROUND=2540, W=1080;
const P={};
function part(id,bx=0,by=0,o={}){const el=document.getElementById(id);if(!el)throw new Error('no '+id);
  return P[id]=Object.assign({el,bx,by,x:0,y:0,r:0,s:1,sx:1,sy:1,k:0,o:1},o);}
const WALKERS=[];let OFF={};
function walker(p,A,dir){const sc=P[p].s;WALKERS.push({p,A,dir,stride:4*245*Math.sin(A*Math.PI/180)*sc});P[p].wk=0;P[p].carry=0;}
function o(id,k,v){(OFF[id]||(OFF[id]={r:0,y:0,k:0}))[k]+=v;}
function computeWalk(){OFF={};for(const w of WALKERS){const st=P[w.p],wk=st.wk,p=w.p;
  // ademhaling (altijd)
  const br=Math.sin(TNOW*2*Math.PI/3.6+w.A);o(p+'_u','y',br*1.6);o(p+'_h','r',br*.8);
  if(wk<=0)continue;
  const a=2*Math.PI*w.dir*st.x/w.stride, s=Math.sin(a), c=Math.cos(a), A=w.A;
  const hip=245*(1-Math.cos(A*Math.PI/180))*s*s*wk;
  for(const [leg,ss,cc] of [['_lf',s,c],['_lb',-s,-c]]){o(p+leg,'r',-A*ss*wk);o(p+leg+'_s','r',wk*(38*Math.pow(Math.max(0,cc),1.4)+4));o(p+leg,'y',hip);}
  o(p+'_u','y',hip);o(p+'_sk','y',hip);o(p+'_u','r',3*wk);o(p+'_h','r',-2*wk);o(p+'_sk','k',5*s*wk);
  o(p+'_af','r',A*1.25*s*wk*(1-st.carry));o(p+'_af_f','r',-12*wk*(1-st.carry));
  o(p+'_ab','r',-A*1.25*s*wk);o(p+'_ab_f','r',-12*wk);}}
let TNOW=0;
function handPos(p){const u=P[p+'_u'],a=P[p+'_af'],f=P[p+'_af_f'],o=(OFF[p+'_u']||{y:0}).y,ao=(OFF[p+'_af']||{r:0}).r;const sx=P[p].sx;
 const th1=(u.r+a.r+ao)*Math.PI/180,th2=th1+f.r*Math.PI/180;
 return [P[p].bx+P[p].x+sx*(4-112*Math.sin(th1)-102*Math.sin(th2)),GROUND-250+u.y+o-170+112*Math.cos(th1)+102*Math.cos(th2)];}
function renderAll(){computeWalk();if(P.cup&&P.cup.follow){const h=handPos('ym');P.cup.x=h[0]+6;P.cup.y=h[1]-2;}for(const id in P){const p=P[id];const lk=p.link;const src=lk?P[lk]:p;const of=OFF[lk||id]||{r:0,y:0,k:0};
  if(lk){p.x=src.x;p.y=src.y;p.r=src.r;}
  if(p.cam){p.el.setAttribute('transform',`translate(540 960) scale(${p.s}) translate(${-540+p.x} ${-960+p.y})`);continue;}
  p.el.setAttribute('transform',`translate(${(p.bx+p.x).toFixed(2)} ${(p.by+p.y+of.y).toFixed(2)}) rotate(${(p.r+of.r).toFixed(3)}) skewX(${(p.k+of.k).toFixed(3)}) scale(${(p.s*p.sx).toFixed(4)} ${(p.s*p.sy).toFixed(4)})`);
  p.el.setAttribute('opacity',p.o.toFixed(3));}}

// ---------- characters ----------
function arm(id,sleeve,cuff,skin){return `
  <g id="${id}"><rect x="-16" y="-8" width="32" height="128" rx="16" fill="${sleeve}"/>
   <g id="${id}_f"><rect x="-14" y="-6" width="28" height="98" rx="14" fill="${sleeve}"/>
    <rect x="-15" y="76" width="30" height="14" rx="6" fill="${cuff}"/>
    <circle cx="0" cy="102" r="16" fill="${skin}"/></g></g>`;}
function head(id,c,beardLong){
  const beard=beardLong
   ?`<path d="M-38,-26 Q-34,30 10,40 Q40,36 48,-14 Q30,-4 8,-6 Q-16,-8 -38,-26Z" fill="${c.hair}"/>`
   :`<path d="M-36,-22 Q-22,12 16,8 Q38,2 46,-20 Q30,-6 8,-8 Q-16,-8 -36,-22Z" fill="${c.hair}"/>`;
  return `<g id="${id}">
   <rect x="-13" y="-10" width="28" height="30" rx="8" fill="${c.skinD}"/>
   <circle cx="0" cy="-46" r="48" fill="${c.skin}"/>
   <circle cx="16" cy="-58" r="26" fill="#fff" opacity=".10"/>
   ${beard}
   <path d="M-48,-56 Q-50,-30 -40,-22 L-30,-56Z" fill="${c.hair}"/>
   <ellipse cx="-10" cy="-44" rx="8" ry="11" fill="${c.skinD}"/>
   <path d="M-48,-56 Q-47,-100 0,-100 Q47,-100 48,-56Z" fill="${c.kufi}"/>
   <rect x="-49" y="-62" width="98" height="9" rx="4.5" fill="${c.kufiS}"/>
   <ellipse cx="33" cy="-30" rx="8" ry="5" fill="#e0525a" opacity=".28"/>
   <path d="M2,-54 q7,-5 14,-1 M23,-55 q8,-4 15,1" stroke="${c.brow||c.hair}" stroke-width="4" fill="none" stroke-linecap="round"/>
   <g id="${id}_e1"><ellipse rx="4.6" ry="6.6" fill="#2a1a14"/><circle cx="1.6" cy="-2.2" r="1.7" fill="#fff"/></g>
   <g id="${id}_e2"><ellipse rx="5.2" ry="7.2" fill="#2a1a14"/><circle cx="1.8" cy="-2.4" r="1.9" fill="#fff"/></g>
   <path d="M43,-44 q8,8 0,11" stroke="${c.skinD}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
   <path id="${id}_mn" d="M24,-21 Q31,-19 38,-21" stroke="#6b2f25" stroke-width="3.6" fill="none" stroke-linecap="round"/>
   <path id="${id}_ms" d="M24,-18 Q31,-24 38,-18" stroke="#6b2f25" stroke-width="3.6" fill="none" stroke-linecap="round" opacity="0"/>
   <path id="${id}_mh" d="M22,-23 Q31,-12 40,-23 Q31,-19 22,-23Z" fill="#7a2e26" stroke="#6b2f25" stroke-width="3" stroke-linejoin="round" opacity="0"/></g>`;}
function leg(id,c){return `<g id="${id}"><rect x="-18" y="-10" width="36" height="140" rx="18" fill="${c.pants}"/>
   <g id="${id}_s"><circle r="17" fill="${c.pants}"/><rect x="-16" y="-4" width="32" height="112" rx="16" fill="${c.pants}"/>
   <path d="M-17,104 Q-19,130 4,130 L40,130 Q51,128 47,117 Q41,104 18,102Z" fill="${c.shoe}"/></g></g>`;}
function man(p,c){return `
 <g id="${p}">
  <ellipse cx="0" cy="2" rx="92" ry="14" fill="#000" opacity=".26" filter="url(#soft)"/>
  ${leg(p+'_lb',{...c,shoe:c.shoeD})}
  ${leg(p+'_lf',c)}
  <g id="${p}_ub"><g id="${p}_ab_w">${arm(p+'_ab',c.robeD,c.robeDD,c.skinD)}</g></g>
  <g id="${p}_sk"><ellipse cx="0" cy="0" rx="70" ry="30" fill="url(#${p}_g)"/>
   <path d="M-70,-8 L70,-8 L94,205 Q0,219 -94,205Z" fill="url(#${p}_g)"/>
   <path d="M10,10 Q16,110 22,200" stroke="${c.robeD}" stroke-width="4" fill="none" opacity=".35"/></g>
  <g id="${p}_u">
   <path d="M-70,6 L-62,-160 Q-58,-194 -20,-198 L24,-198 Q60,-194 64,-160 L72,6Z" fill="url(#${p}_g)"/>
   <path d="M8,-196 L14,-120" stroke="${c.robeD}" stroke-width="4" opacity=".4"/>
   <g id="${p}_h_w">${head(p+'_h',c,c.longBeard)}</g>
   <g id="${p}_af_w">${arm(p+'_af',c.robe,c.robeD,c.skin)}</g>
  </g>
 </g>`;}
function manGrad(p,c){return `<linearGradient id="${p}_g" x1="0" x2="1"><stop offset="0" stop-color="${c.robeD}"/><stop offset=".55" stop-color="${c.robe}"/><stop offset="1" stop-color="${c.robeL}"/></linearGradient>`;}
function regMan(p,x,gy,scale,flip){
  part(p,x,gy,{s:scale,sx:flip?-1:1});
  part(p+'_lb',-6,-250);part(p+'_lf',6,-250);part(p+'_lb_s',0,120);part(p+'_lf_s',0,120);
  part(p+'_u',0,-250);part(p+'_ub',0,-250,{link:p+'_u'});part(p+'_sk',0,-250);
  part(p+'_h',4,-198);part(p+'_af',4,-170);part(p+'_af_f',0,112);
  part(p+'_ab',-6,-170);part(p+'_ab_f',0,112);face(p+'_h');}

function elder(p,c){return `
 <g id="${p}">
  <ellipse cx="40" cy="2" rx="110" ry="12" fill="#000" opacity=".2"/>
  <rect x="68" y="-172" width="38" height="160" rx="19" fill="${c.robeD}"/>
  <path d="M66,-16 Q64,2 82,2 L118,2 Q128,0 124,-10 Q116,-22 90,-22Z" fill="${c.shoeD}"/>
  <rect x="84" y="-172" width="38" height="152" rx="19" fill="${c.robe}"/>
  <rect x="88" y="-32" width="30" height="20" fill="${c.pants}"/>
  <path d="M82,-16 Q80,2 98,2 L134,2 Q144,0 140,-10 Q132,-22 106,-22Z" fill="${c.shoe}"/>
  <rect x="-34" y="-198" width="156" height="60" rx="30" fill="url(#${p}_g)"/>
  <g id="${p}_u">
   ${arm(p+'_ab',c.robeD,c.robeDD,c.skinD)}
   <path d="M-58,6 L-52,-170 Q-46,-202 -6,-206 L20,-206 Q52,-200 56,-168 L66,6Z" fill="url(#${p}_g)"/>
   <g>${head(p+'_h',c,true)}</g>
   ${arm(p+'_af',c.robe,c.robeD,c.skin)}
  </g>
 </g>`;}
function face(h){part(h+'_e1',9,-44);part(h+'_e2',29,-44);part(h+'_mn');part(h+'_ms',0,0,{o:0});part(h+'_mh',0,0,{o:0});}
function regElder(p,x,gy,flip){
  part(p,x,gy,{sx:flip?-1:1});part(p+'_u',0,-168);part(p+'_h',6,-206);
  part(p+'_af',6,-192);part(p+'_af_f',0,112);part(p+'_ab',-4,-192);part(p+'_ab_f',0,112);face(p+'_h');}

const YM={robe:'#2f7a7e',robeL:'#4fa3a5',robeD:'#1f5559',robeDD:'#163f42',skin:'#c98e62',skinD:'#a8714b',hair:'#2a1c13',kufi:'#f4f1ea',kufiS:'#d8d2c4',pants:'#e9e3d6',shoe:'#3b2b22',shoeD:'#2a1f19'};
const EL={robe:'#6a7aa0',robeL:'#8b9bc0',robeD:'#4d5a7c',robeDD:'#3c4763',skin:'#b98058',skinD:'#97643f',hair:'#e9e5dd',brow:'#cfcac0',kufi:'#ffffff',kufiS:'#dcd8cf',pants:'#d8d0c0',shoe:'#5a4030',shoeD:'#3e2c21',longBeard:true};
const PB1={robe:'#8a7f73',robeL:'#a59a8d',robeD:'#6b6258',robeDD:'#544d45',skin:'#b08060',skinD:'#8f6448',hair:'#3a3029',kufi:'#cfc8bb',kufiS:'#b3ac9f',pants:'#c9c1b3',shoe:'#4a3c32',shoeD:'#3a2f28'};
const PB2={robe:'#7b6c8a',robeL:'#968aa4',robeD:'#5d5169',robeDD:'#4a4054',skin:'#a87a5c',skinD:'#8a6046',hair:'#2e2620',kufi:'#bfb7c8',kufiS:'#a39cac',pants:'#c4bcb0',shoe:'#3e332c',shoeD:'#302822'};

// ---------- scene svg ----------
function stars(){let s='';for(let i=0;i<130;i++){const x=R()*W,y=R()*1600,r=R()*2.4+.6;s+=`<circle class="star" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="#fff" opacity="${(.4+R()*.6).toFixed(2)}"/>`;}return s;}
function cloud(id,x,y,s,o){return `<g id="${id}" opacity="${o}"><g transform="translate(${x} ${y}) scale(${s})" fill="#ffe6cf">
 <ellipse cx="0" cy="0" rx="120" ry="34"/><ellipse cx="-50" cy="-18" rx="60" ry="40"/><ellipse cx="40" cy="-28" rx="70" ry="50"/><ellipse cx="110" cy="-6" rx="60" ry="30"/></g></g>`;}
function minaret(x,top,base,w,col,win){return `

tl.to('#t1',{opacity:0,scale:1.25,filter:'blur(14px)',duration:.45,ease:'power2.in'},pan);
tl.fromTo(P.cam,{y:0,s:1.08},{y:-980,s:1,duration:2.0,ease:'power3.inOut',immediateRender:false},pan);sfx(pan,'whoosh');
tl.to(P.starsG,{o:0,duration:1.4},pan+.4);
tl.fromTo(P.sun,{s:.7,o:.6},{s:1,o:1,duration:4,ease:'power1.out',immediateRender:false},pan);

// ---- 3. the bump
const B=en('v3')-.35;               // moment of impact
walk('ym',B-2.6,2.6,580,true);       // -160 -> 420
walk('pa',B-1.5,1.5,-640);           // 1250 -> 610
tl.to(P.cam,{s:1.15,x:-10,y:-1060,duration:2.2,ease:'sine.inOut'},B-1.8);
cap('c3',st('v3'),en('v3')+.35);
// impact reactions
tl.to(P.ym,{x:560,duration:.25,ease:'power2.out'},B).to(P.ym_u,{r:-9,duration:.12,ease:'power2.out'},B).to(P.ym_u,{r:0,duration:.5,ease:'elastic.out(1,.5)'},B+.12);
tl.to(P.pa,{x:-610,duration:.3,ease:'power2.out'},B).to(P.pa_u,{r:-10,duration:.12},B).to(P.pa_u,{r:0,duration:.5,ease:'elastic.out(1,.5)'},B+.12);
tl.to('#flash',{opacity:.35,duration:.06},B).to('#flash',{opacity:0,duration:.35},B+.06);
tl.to(P.cam,{x:-20,duration:.05,repeat:5,yoyo:true,ease:'none'},B);
sfx(B,'thud');
// cup spills and falls
tl.set(P.cup,{follow:0},B);
tl.to(P.cup,{r:-115,duration:.25,ease:'power2.out'},B);
tl.to(P.tea,{o:0,duration:.2},B+.05);
tl.to(P.cup,{x:'+=60',duration:.7,ease:'power1.out'},B+.15);
tl.to(P.cup,{y:GROUND-4,duration:.7,ease:'bounce.out'},B+.15);
tl.to(P.cup,{r:-90,duration:.7},B+.15);
sfx(B+.05,'splash');sfx(B+.55,'clink');
for(let i=0;i<14;i++){const d=P['dr'+i];const onRobe=i<7;
  const tx=onRobe?440+R()*70:470+R()*170,ty=onRobe?2250+R()*150:GROUND-2;
  tl.set(d,{x:548,y:2222,o:1},B+.02);
  tl.to(d,{x:tx,duration:.45+R()*.2,ease:'power1.out'},B+.02);
  tl.to(d,{y:2222-40-R()*60,duration:.18,ease:'power2.out'},B+.02).to(d,{y:ty,duration:.32,ease:'power2.in'},B+.2);
  tl.to(d,{o:onRobe?0:.7,duration:.2},B+.5);
  if(!onRobe)tl.to(d,{sy:.35,sx:1.6,duration:.1},B+.5);}
tl.to(P.stain,{o:1,s:1,duration:.5,ease:'power2.out'},B+.25);
// reactions after impact
tl.to(P.ym_h,{r:22,duration:.5},B+.4);                 // looks down at his robe
tl.to(P.ym_af,{r:0,duration:.5},B+.3).to(P.ym_af_f,{r:0,duration:.5},B+.3).set(P.ym,{carry:0},B+.3);
tl.to(P.pa_af,{r:-45,duration:.4},B+.35).to(P.pa_af_f,{r:-110,duration:.4},B+.35); // "oh no" hands
tl.to(P.pa_ab,{r:-30,duration:.4},B+.35).to(P.pa_ab_f,{r:-100,duration:.4},B+.35);
tl.to(P.pa_h,{r:12,duration:.4},B+.5);

// ---- 4. anger rises
cap('c4',st('v4'),st('v5')-.2);
const R0=st('v4')+du('v4')*.42;
$('mRage').textContent=TXT.rage;$('mCalm').textContent=TXT.calm;
tl.to('#rage',{opacity:1,duration:.9,ease:'power2.out'},R0).to('#redwash',{opacity:.22,duration:.9},R0);
tl.to('#meterBox',{opacity:1,duration:.3},R0);
tl.fromTo('#mlabel',{scale:.6},{scale:1,duration:.5,ease:'back.out(2.5)',immediateRender:false},R0);
tl.to('#mfill',{width:'94%',duration:1.8,ease:'power2.in'},R0+.15);
tl.to('#mRage',{x:6,duration:.05,repeat:36,yoyo:true,ease:'none'},R0+.6);
tl.to(P.ym_h,{r:4,duration:.4},R0).to(P.ym_ab,{r:12,duration:.4},R0).to(P.ym_ab_f,{r:-95,duration:.4},R0);
tl.to(P.ym_af,{r:8,duration:.4},R0).to(P.ym_af_f,{r:-70,duration:.4},R0);          // clenched fists
tl.to(P.ym_u,{x:2.5,duration:.05,repeat:40,yoyo:true,ease:'none'},R0+.4);
tl.to(P.cam,{s:1.24,x:-30,y:-1100,duration:2,ease:'sine.inOut'},R0);
[0,.55,1.05,1.5,1.9].forEach(d=>sfx(R0+.1+d,'beat'));

// ---- 5. he stops and breathes
cap('c5',st('v5'),st('v6')-.2);
const C0=st('v5'),B0=st('v5')+du('v5')*.42;
tl.to('#rage',{opacity:0,duration:1.6,ease:'power2.inOut'},C0+.2).to('#redwash',{opacity:0,duration:1.2},C0+.2);
tl.to(P.ym_ab,{r:0,duration:.6},C0+.2).to(P.ym_ab_f,{r:0,duration:.6},C0+.2).to(P.ym_af,{r:0,duration:.6},C0+.2).to(P.ym_af_f,{r:0,duration:.6},C0+.2);
tl.to(P.ym_h,{r:-6,duration:.7},B0);
tl.to(P.ym_u,{sy:1.045,duration:1.2,ease:'sine.inOut'},B0).to(P.ym_u,{sy:1,duration:1.1,ease:'sine.inOut'},B0+1.2);
tl.fromTo(P.brth,{o:0,s:.45},{o:1,s:1.15,duration:1.3,ease:'sine.out',immediateRender:false},B0).to(P.brth,{o:0,s:1.4,duration:.9,ease:'sine.in'},B0+1.3);
tl.to('#mfill',{width:'0%',duration:1.8,ease:'power2.inOut'},B0);
tl.to('#mRage',{opacity:0,duration:.4},B0+.4).to('#mCalm',{opacity:1,duration:.4},B0+.4);
tl.to('#meterBox',{opacity:0,y:-30,duration:.4},st('v6')-.3);
tl.to(P.cam,{s:1.2,x:0,y:-1110,duration:2,ease:'sine.inOut'},C0);
sfx(B0,'breath');

// ---- 6. forgiveness
cap('c6',st('v6'),st('v7')-.45);
const F0=st('v6');
tl.to(P.ym_h,{r:-2,duration:.4},F0-.3);
tl.to(P.ym_af,{r:-62,duration:.6,ease:'back.out(1.3)'},F0);                // hand on his shoulder
tl.to(P.pa_af,{r:5,duration:.6},F0+.4).to(P.pa_af_f,{r:-155,duration:.6},F0+.4); // hand on chest
tl.to(P.pa_ab,{r:0,duration:.6},F0+.2).to(P.pa_ab_f,{r:0,duration:.6},F0+.2);
tl.to(P.pa_h,{r:-4,duration:.5},F0+.3);
tl.fromTo(P.halo,{o:0,s:.5},{o:.85,s:1,duration:2,ease:'power2.out',immediateRender:false},F0+.3);
tl.to(P.cam,{s:1.26,x:15,y:-1130,duration:2.4,ease:'sine.inOut'},F0-.2);

// ---- 7. hadith (motion graphics over the scene)
const H0=st('v7');
tl.to(P.ym_af,{r:0,duration:.6},H0-.6).to(P.pa_af,{r:0,duration:.6},H0-.4).to(P.pa_af_f,{r:0,duration:.6},H0-.4);
tl.to('#dim',{opacity:1,duration:.8},H0-.5).to('#hdim',{opacity:1,duration:.8},H0-.5);
tl.to('#glow',{opacity:.8,duration:1.5},H0-.3);
tl.to(P.rays,{o:.8,duration:1.5},H0-.3);
pts.forEach(p=>{p.bx-=180;const t=H0-.3+R()*(du('v7')-1),d=2+R()*1.8;
  tl.fromTo(p,{o:0,y:0,s:.4},{o:1,y:-120,s:1,duration:d*.35,ease:'power1.out',immediateRender:false},t);
  tl.to(p,{y:-420-R()*300,x:(R()-.5)*120,o:0,duration:d*.65,ease:'sine.in'},t+d*.35);});
tl.to(P.cam,{s:1.34,y:-1180,duration:du('v7')+1,ease:'sine.inOut'},H0-.5);
sfx(H0-.5,'whoosh');sfx(H0,'shimmer');
const arW=words('hAr',$('hAr').textContent),trW=words('hTr',TXT.had);$('hSrc').textContent=TXT.src;gsap.set('#hSrc',{opacity:0});
tl.set('#had',{opacity:1},H0-.1);
reveal(arW,H0+.1,du('v7')*.4,{d:.6});
reveal(trW,H0+du('v7')*.22,du('v7')*.7,{d:.5});
tl.fromTo('#hSrc',{opacity:0,y:20},{opacity:1,y:0,duration:.6,immediateRender:false},en('v7')-.7);

// ---- 8. end card
const E0=st('v8')-.45;
tl.to('#had',{opacity:0,filter:'blur(10px)',duration:.4,ease:'power2.in'},E0);
tl.to('#end2',{opacity:1,duration:.5},E0+.1);sfx(E0,'whoosh');
tl.to(ST,{d3:1,duration:1.4,ease:'power2.inOut'},E0+.2);
const wE=words('eBig',TXT.big);fit('eBig');reveal(wE,st('v8'),.3,{d:.7,rot:6});sfx(st('v8'),'boom');
$('eCta').textContent=TXT.cta;$('eSrc').textContent=TXT.esrc;
tl.fromTo('#end2 .pill',{opacity:0,scale:.6},{opacity:1,scale:1,duration:.6,ease:'back.out(2)',immediateRender:false},st('v8')+du('v8')*.5);
tl.fromTo('#eSrc',{opacity:0},{opacity:1,duration:.5,immediateRender:false},st('v8')+du('v8')*.5+.3);
tl.to('#end2 .pill',{scale:1.06,duration:.45,repeat:3,yoyo:true,ease:'sine.inOut'},en('v8')+.1);
sfx(E0+.2,'shimmer');

// faces
function blink(h,t){tl.to([P[h+'_e1'],P[h+'_e2']],{sy:.12,duration:.07,yoyo:true,repeat:1,ease:'power1.inOut'},t);}
function mouth(h,m,t){['mn','ms','mh'].forEach(k=>tl.to(P[h+'_'+k],{o:k===m?1:0,duration:.2},t));}
for(let t=1.3;t<T;t+=2.7+R()*1.2){blink('ym_h',t);blink('pa_h',t+.6);}
mouth('ym_h','ms',B+.3);mouth('pa_h','ms',B+.3);
tl.to([P.ym_h_e1,P.ym_h_e2],{sy:.55,duration:.3},R0).to([P.ym_h_e1,P.ym_h_e2],{sy:.12,duration:.3},B0).to([P.ym_h_e1,P.ym_h_e2],{sy:1,duration:.3},B0+1.6);
mouth('ym_h','mn',B0+1.4);mouth('ym_h','mh',F0-.2);mouth('pa_h','mh',F0+.7);

tl.to('#stage',{opacity:0,duration:.5,ease:'power1.in'},T-.5);
tl.set({},{},T);

// ---------- seek API ----------
const grain=$('grain');
window.__sfx=SFX;window.__duration=T;
window.__seek=function(t){TNOW=t;tl.seek(t,false);renderAll();
  drawStar(star2,$('star2'),ST.d2,540,760,ST.r2,ST.s2,ST.o2);drawStar(star3,$('star3'),ST.d3,540,1530,ST.r2,.5,ST.o3);
  const g=rng(Math.floor(t*30)+1);grain.style.transform=`translate(${(g()*80-40).toFixed(0)}px,${(g()*80-40).toFixed(0)}px)`;};
window.__seek(0);window.__ready=true;
if(!navigator.webdriver){tl.eventCallback('onUpdate',()=>window.__seek(tl.time()));tl.play(0);}
});
</script>
</body>
</html>
